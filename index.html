    .preview-menu { position: relative; padding: clamp(40px,10vw,140px) clamp(20px,10vw,150px); }
    .preview-logo { display: block; width: min(270px,78vw); height: auto; }

    button { font-family: inherit; }
    .test-recharge-entry {
  display: flex;
  align-items: center;
  gap: 10px;
  width: min(224px, 100%);
  min-height: 56px;
  margin: 4px 0 10px;
  padding: 4px 12px 4px 5px;
  color: #ecfaff;
  text-align: left;
  border: 1px solid #579ab9;
  border-left: 3px solid #a0e5ff;
  background: linear-gradient(110deg, #1b3d58, #142439 82%);
  box-shadow: 0 0 20px #58bdff22, inset 0 0 20px #58bdff14;
  cursor: pointer;
  pointer-events: auto;
}

.main-menu .test-recharge-entry {
  margin-left: -8rem;
}

.test-recharge-entry:hover,
.test-recharge-entry:focus-visible {
  border-color: #b2eaff;
  background: linear-gradient(110deg, #285673, #18304b 82%);
  box-shadow: 0 0 24px #58bdff55;
}

.test-recharge-entry img {
  width: 49px;
  height: 44px;
  object-fit: contain;
}

.test-recharge-entry strong,
.test-recharge-entry small {
  display: block;
  line-height: 1.45;
}

.test-recharge-entry strong { font-size: 18px; }
.test-recharge-entry small { color: #aed1e4; font-size: 12px; }
.test-recharge-chevron { margin-left: auto; font-size: 26px; }

.test-recharge-wallet {
  min-height: 40px;
  padding: 5px 9px;
  color: #d8f3ff;
  border: 1px solid #467a98;
  background: #15283f;
}

.test-recharge-wallet strong { margin-left: 5px; color: #b9e9ff; }

.test-recharge-dialog {
  box-sizing: border-box;
  width: min(680px, calc(100% - 24px));
  max-width: none;
  max-height: calc(100vh - 24px);
  max-height: calc(100dvh - 24px);
  padding: 0;
  color: #edf6ff;
  font-family: inherit;
  font-size: 15px;
  line-height: 1.45;
  border: 1px solid #4a6c8a;
  border-top: 2px solid #8edaff;
  background: linear-gradient(150deg, #213952, #0d1728 57%);
  box-shadow: 0 18px 78px #050912cf, 0 0 30px #60baff22;
  overflow: auto;
}

.test-recharge-dialog::backdrop {
  background: #050811aa;
  backdrop-filter: blur(4px);
}

.test-recharge-form { margin: 0; }

.test-recharge-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  padding: 19px 23px 13px;
  border-bottom: 1px solid #41607888;
}

.test-recharge-header h2 {
  margin: 0;
  color: #f1faff;
  font-size: clamp(23px, 4.3vw, 32px);
  font-weight: 700;
  line-height: 1.2;
  letter-spacing: .08em;
}

.test-recharge-header p {
  margin: 5px 0 0;
  color: #a9c5d8;
  font-size: 12px;
  letter-spacing: .12em;
}

.test-recharge-close {
  flex-shrink: 0;
  width: 40px;
  height: 40px;
  padding: 0;
  color: #d3eafa;
  font-size: 28px;
  line-height: 1;
  border: 1px solid #496780;
  background: #0d1a29;
  cursor: pointer;
}

.test-recharge-close:hover { color: white; border-color: #a0dbf5; }

.test-recharge-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 9px;
  min-width: 0;
  margin: 0;
  padding: 14px 23px;
  border: 0;
}

.test-recharge-option { display: block; position: relative; min-width: 0; margin: 0; cursor: pointer; }
.test-recharge-option input,
.test-recharge-sr { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }

.test-recharge-tile {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 108px;
  padding: 3px 4px 6px;
  border: 1px solid #3a4f68;
  background: radial-gradient(ellipse at 50% 30%, #34416c, #111d31 75%);
  line-height: 1.25;
  white-space: nowrap;
}

}

function showTestRecharge(reserve, resolveImage = (path) => path) {
  const existing = document.getElementById('test-recharge-dialog');
  if (existing) return;

  const opener = document.activeElement;
  const dialog = document.createElement('dialog');
  dialog.id = 'test-recharge-dialog';
  dialog.className = 'test-recharge-dialog';
  dialog.setAttribute('aria-labelledby', 'test-recharge-title');
  dialog.innerHTML = `
    <form class="test-recharge-form">
      <header class="test-recharge-header">
        <div>
          <h2 id="test-recharge-title">钻石充值</h2>
          <p>模拟充值 · USD</p>
        </div>
        <button class="test-recharge-close" type="button" aria-label="返回游戏">×</button>
      </header>
      <fieldset class="test-recharge-grid">
        <legend class="test-recharge-sr">选择充值档位</legend>
        ${products.map((product, index) => `
          <label class="test-recharge-option">
            <input type="radio" name="recharge-sku" value="${product.sku}" ${index === 0 ? 'checked autofocus' : ''}>
            <span class="test-recharge-tile">
              <img alt="" draggable="false">
              <span class="test-recharge-quantity">${product.diamonds.toLocaleString('en-US')} <small>钻石</small></span>
              <strong>${usd(product.amountCents)}</strong>
            </span>
          </label>`).join('')}
      </fieldset>
      <footer class="test-recharge-footer">
        <p class="test-recharge-status" role="status" aria-live="polite">模拟订单，实际扣款 $0.00。</p>
        <div class="test-recharge-actions">
          <div class="test-recharge-summary"><span>所选档位</span><strong></strong></div>
          <button class="test-recharge-submit" type="submit">提交测试订单</button>
        </div>
      </footer>
    </form>`;

  const form = dialog.querySelector('form');
  const grid = dialog.querySelector('fieldset');
  const close = dialog.querySelector('.test-recharge-close');
  const status = dialog.querySelector('.test-recharge-status');
  const submit = dialog.querySelector('.test-recharge-submit');
  const summary = dialog.querySelector('.test-recharge-summary strong');
  const tiles = dialog.querySelectorAll('.test-recharge-tile img');
  let product = products[0];
  let requestId;
  let pending = false;
  let reserved = false;

  tiles.forEach((image, index) => { image.src = resolveImage(products[index].image); });
  summary.textContent = usd(product.amountCents);

  grid.addEventListener('change', (event) => {
    product = products.find(({ sku }) => sku === event.target.value);
    requestId = undefined;
    reserved = false;
    submit.disabled = false;
    submit.textContent = '提交测试订单';
    summary.textContent = usd(product.amountCents);
    status.textContent = '模拟订单，实际扣款 $0.00。';
  });

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    if (pending || reserved) return;

    pending = true;
    grid.disabled = true;
    close.disabled = true;
    submit.disabled = true;
    submit.textContent = '正在登记…';
    status.textContent = '';
    try {
      if (!requestId) requestId = newRequestId();
      const receipt = await reserve({
        requestId,
        sku: product.sku,
        amountCents: product.amountCents,
        currency: product.currency,
      });
      if (!receipt || receipt.status !== 'reserved' || receipt.orderId !== requestId || receipt.amountCents !== product.amountCents) {
        throw new Error('未收到测试订单回执，请重试。');
      }
      reserved = true;
      status.textContent = `${usd(product.amountCents)} 测试订单已登记。实际扣款 $0.00。`;
    } catch (error) {
      status.textContent = error.message || '暂时无法登记，请重试。';
    } finally {
      pending = false;
      grid.disabled = false;
      close.disabled = false;
      submit.disabled = reserved;
      submit.textContent = reserved ? '已登记' : '重新提交';
      if (reserved) close.focus();
    }
  });

  close.addEventListener('click', () => dialog.close());
  dialog.addEventListener('cancel', (event) => { if (pending) event.preventDefault(); });
  dialog.addEventListener('close', () => {
    dialog.remove();
    if (opener && opener.isConnected) opener.focus();
  });
  document.body.append(dialog);
  dialog.showModal();
}

module.exports = showTestRecharge;
