<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08111d">
  <title>Duelyst · 练习对战</title>
  <link rel="stylesheet" href="practice.css">
  <link rel="stylesheet" href="recharge.css">
  <script defer src="practice.js"></script>
</head>
<body>
  <header class="masthead">
    <a class="brand" href="./" aria-label="Duelyst 首页"><img src="brand.png" alt="Duelyst"></a>
    <button class="recharge" id="recharge" type="button"><img src="resources/shop/shop_premium_pack_small.png" alt="">模拟充值</button>
  </header>
  <main>
    <section class="lobby" id="lobby" aria-labelledby="title">
      <div class="lobby-copy">
        <p class="mode">PRACTICE DUEL</p>
        <h1 id="title">练习对战</h1>
        <p>选择阵营，指挥统帅和随从，在棋盘上击败电脑对手。</p>
        <fieldset class="factions">
          <legend>选择阵营</legend>
          <label class="faction lyonar"><input type="radio" name="faction" value="lyonar" checked><img src="sprites/1.png" alt=""><span><strong>Lyonar</strong><small>正面推进</small></span></label>
          <label class="faction songhai"><input type="radio" name="faction" value="songhai"><img src="sprites/101.png" alt=""><span><strong>Songhai</strong><small>灵活进攻</small></span></label>
        </fieldset>
        <button type="button" id="start" class="primary" disabled>正在加载游戏…</button>
        <p class="lobby-status" id="load-status" role="status"></p>
      </div>
    </section>
    <section class="arena" id="arena" aria-label="对战棋盘" hidden>
      <div class="arena-top">
        <button type="button" id="leave" class="quiet">返回大厅</button>
        <strong id="round">第 1 回合</strong>
        <span>人机对战</span>
      </div>
      <div class="players" id="players"></div>
      <div class="board" id="board" aria-label="9 列 5 行棋盘"></div>
      <p class="notice" id="notice" role="status" aria-live="polite"></p>
      <div class="battle-bottom">
        <div class="hand" id="hand" aria-label="手牌"></div>
        <aside class="battle-controls">
          <button type="button" class="primary" id="turn">确认起手</button>
          <button type="button" class="quiet" id="replace" hidden>替换手牌</button>
          <button type="button" class="quiet" id="cancel" hidden>取消选择</button>
        </aside>
      </div>
      <p class="inspector" id="inspect" aria-live="polite"></p>
    </section>
  </main>
</body>
</html>
